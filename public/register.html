<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account | TicketHub</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="auth-page"><a class="brand" href="/">Ticket<span>Hub</span></a>
<form class="auth-card" id="register-form"><p class="eyebrow">JOIN TICKETHUB</p><h1>Create account</h1>
<label>Full name<input name="full_name" required></label>
<label>Email<input name="email" type="email" required></label>
<label>Phone number<input name="phone" placeholder="07XXXXXXXX" required></label>
<label>Password<input name="password" type="password" minlength="8" required></label>
<button class="button full">Create account</button><p id="message" class="message"></p>
<p class="muted">Already registered? <a href="/login.html">Log in</a></p></form>
<script src="/js/auth.js"></script></body></html>
